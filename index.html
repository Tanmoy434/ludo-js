
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ludo</title>

  <link rel="stylesheet" href="./ludo/style.css" />

  <style>
    /* Background Page Styles */
    .main-background {
      background: url('./ludo/Image/ludubg.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      margin: 0;
    }

    .button-background {
      position: relative;
      background: url('./ludo/Image/ludubutton.webp');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    /* Overlay */
    .button-background::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(24, 20, 20, 0.5);
      z-index: 0;
    }

    .start-screen {
      position: relative;
      z-index: 1;
    }

    .start-screen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      gap: 10px;
      color: white;
      text-shadow: 1px 1px 3px black;
      margin-top: 20px;
    }

    .player-btn:hover {
      background: #d0e6ff;
    }

    .main-area {
      display: none;
      padding: 20px;
    }

    .back-btn,
    .reset-btn {
      background: #fff;
      border: 1px solid #999;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 10px;
      margin-right: 10px;
    }

    .back-btn:hover,
    .reset-btn:hover {
      background: #f0f0f0;
    }

    /* Winner Modal */
    .winner-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .winner-box {
      background: white;
      padding: 25px 40px;
      border-radius: 12px;
      text-align: center;
      font-size: 22px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
    }

    .winner-close-btn {
      margin-top: 20px;
      padding: 10px 25px;
      border: none;
      background: #4caf50;
      color: white;
      font-size: 18px;
      border-radius: 8px;
      cursor: pointer;
    }

    .winner-close-btn:hover {
      background: #45a049;
    }
  </style>
</head>

<body class="button-background">
  <div class="app">

    <!-- Start Screen -->
    <div class="start-screen">
      <h1>Select Players</h1>
      <button id="btn-2p" class="player-btn">2 Players</button>
      <button id="btn-3p" class="player-btn">3 Players</button>
      <button id="btn-4p" class="player-btn">4 Players</button>
      <button id="btn-ai" class="player-btn">Vs AI</button>
    </div>

    <!-- Main Game -->
    <main class="main-area">

      <button class="back-btn">⬅ Back</button>

      <!-- Winner Modal -->
    <div id="winner-modal" class="winner-modal">
      <div class="winner-box">
        <div class="winner-icon">🏆</div>
        <h2 id="winner-text" class="winner-title"></h2>
        <button id="winner-close" class="winner-btn">Continue</button>
      </div>
    </div>

      <div class="ludo-container">
        <div class="ludo">

          <!-- Player labels -->
          <div class="player-name p1-name">Player 1</div>
          <div class="player-name p2-name">Player 2</div>
          <div class="player-name p3-name">Player 3</div>
          <div class="player-name p4-name">Player 4</div>

          <div class="player-pieces">
            <!-- P1 -->
            <div class="player-piece" player-id="Player1" piece="0"></div>
            <div class="player-piece" player-id="Player1" piece="1"></div>
            <div class="player-piece" player-id="Player1" piece="2"></div>
            <div class="player-piece" player-id="Player1" piece="3"></div>

            <!-- P2 -->
            <div class="player-piece" player-id="Player2" piece="0"></div>
            <div class="player-piece" player-id="Player2" piece="1"></div>
            <div class="player-piece" player-id="Player2" piece="2"></div>
            <div class="player-piece" player-id="Player2" piece="3"></div>

            <!-- P3 -->
            <div class="player-piece" player-id="Player3" piece="0"></div>
            <div class="player-piece" player-id="Player3" piece="1"></div>
            <div class="player-piece" player-id="Player3" piece="2"></div>
            <div class="player-piece" player-id="Player3" piece="3"></div>

            <!-- P4 -->
            <div class="player-piece" player-id="Player4" piece="0"></div>
            <div class="player-piece" player-id="Player4" piece="1"></div>
            <div class="player-piece" player-id="Player4" piece="2"></div>
            <div class="player-piece" player-id="Player4" piece="3"></div>
          </div>

          <div class="player-bases">
            <div class="player-base" player-id="Player1"></div>
            <div class="player-base" player-id="Player2"></div>
            <div class="player-base" player-id="Player3"></div>
            <div class="player-base" player-id="Player4"></div>
          </div>
        </div>

        <aside class="footer">
          <div class="row">
            <button id="dice-btn" class="btn btn-dice">Roll</button>
            <div class="dice-value"></div>
          </div>
          <h2 class="active-player">Active Player: <span></span></h2>
        </aside>
      </div>
    </main>
  </div>

  <!-- PAGE DISPLAY SCRIPT -->
  <script>
    const startScreen = document.querySelector('.start-screen');
    const mainArea = document.querySelector('.main-area');
    const playerButtons = document.querySelectorAll('.player-btn');
    const backBtn = document.querySelector('.back-btn');
    const resetBtn = document.querySelector('.reset-btn');
    const body = document.body;

    // Show game screen
    playerButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        startScreen.style.display = 'none';
        mainArea.style.display = 'block';

        body.classList.remove('button-background');
        body.classList.add('main-background');
      });
    });

    // BACK BUTTON -> Returns to start screen
    backBtn.addEventListener('click', () => {
      location.reload();
    });

    // RESET BUTTON -> Restart game
    resetBtn.addEventListener('click', () => {
      location.reload();
    });

    // WINNER MODAL FUNCTION
    function showWinner(playerName) {
      document.getElementById("winner-text").innerText = playerName + " Wins!";
      document.getElementById("winner-modal").style.display = "flex";
    }

    // Close modal
    document.getElementById("winner-close").addEventListener("click", () => {
      location.reload();
    });

    // Make showWinner() available globally
    window.showWinner = showWinner;
  </script>

  <!-- MAIN GAME SCRIPT -->
  <script src="./main.js" type="module"></script>

</body>

</html>
